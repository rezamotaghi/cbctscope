name: Site update

# Started by hand only, from main (docs/web-build.md, section 9): the second way the site
# changes, for what only the website shows (wording, layout, the manual). It deploys the web
# build from main without a new version, installers or DOI; the release workflow stays the way
# to change the desktop app, the agent side, or to publish a citable version. The test job is
# the release's test job step for step (tests/siteDeploy.test.ts fails when the two differ),
# the build job makes the same `site` artifact, and the deploy job runs the release's deploy
# steps after two guards: the run must be on main (checked first by the ref job, before any
# suite starts, and again in deploy), and GitHub's latest release must have the tag
# v<package.json version> and carry the three installers the download menu links to
# (scripts/release-assets.mjs --site-update), because the site names that version on its
# update page and leads its download menu to that release. The deploy job shares the release
# deploy's concurrency group, so the two deploys take turns.
#
# After a site update has gone out, start a new site update from main instead of re-running an
# older run: a re-run builds its original commit and would put older files back.
on:
  workflow_dispatch:

# Least privilege: every job reads the repo and nothing more.
permissions:
  contents: read

jobs:
  # cheap and first: a run from any ref but main stops here, before the suites start
  ref:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a run from any ref but main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::site-update: this run is on $GITHUB_REF; a site update deploys from main only: start it again with main selected under Use workflow from"
            exit 1
          fi

  test:
    needs: ref
    runs-on: ubuntu-latest
    steps:
      # full history: tests/manual.test.ts reads git history to check CITATION.cff
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:web
      # the tests that read the export (skipped by npm test, before it exists)
      - run: npx vitest run tests/webBudget.test.ts tests/siteExport.test.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  build:
    needs: ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the site answers at the root of https://cbctscope.com: no base path
      - name: Build the web target
        run: npm run build:web
        env:
          NEXT_PUBLIC_BASE_PATH: ''
      # the deploy job uploads these files and checks the served site against them
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: out
          if-no-files-found: error
          # the owner's check of the public address reads these files
          retention-days: 30

  # The release's deploy steps, after the two guards. Nothing reaches Vercel unless both pass.
  deploy:
    needs: [ref, test, build]
    runs-on: ubuntu-latest
    # of the jobs written here, this one and release.yml's deploy read the environment's
    # secrets; who could is set by the environment's rules (docs/web-build.md, section 9, step 11)
    environment: production
    # only the deploys take turns, this one and release.yml's, so the tests and the builds never
    # queue; a deploy waiting behind another can be replaced by a newer waiting one
    concurrency:
      group: site
      cancel-in-progress: false
    # two installs, one upload of the built files and one check: minutes, not an hour
    timeout-minutes: 30
    steps:
      - name: Refuse a run from any ref but main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::site-update: this run is on $GITHUB_REF; a site update deploys from main only: start it again with main selected under Use workflow from"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # the site names the version in package.json and links to the latest release's installers:
      # unless that release has the tag v<version> and carries all three, the job fails here and
      # the site stays as it was
      - name: Check the latest release is this version and carries the installers
        run: node scripts/release-assets.mjs --site-update
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: out
      # the Vercel CLI lives in deploy/, with its own lockfile, outside the app's dependencies
      - name: Install the Vercel CLI
        run: npm ci
        working-directory: deploy
      - name: Lay out the prebuilt deployment
        run: node scripts/vercel-output.mjs out "$RUNNER_TEMP/site"
      - name: Deploy to production
        run: |
          deploy/node_modules/.bin/vercel deploy --prebuilt --prod --cwd "$RUNNER_TEMP/site" > "$RUNNER_TEMP/deploy.txt"
          cat "$RUNNER_TEMP/deploy.txt"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TELEMETRY_DISABLED: '1'
      # the deployment's own address, behind Deployment Protection
      - name: Check the deployment as served
        run: node scripts/site-check.mjs --base-from "$RUNNER_TEMP/deploy.txt" --out out --attempts 3
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
