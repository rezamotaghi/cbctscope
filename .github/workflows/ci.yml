name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job reads the repo and nothing more unless it says so.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history: tests/manual.test.ts reads git history (the commit that introduced
      # the current version) to check CITATION.cff. A shallow clone attributes that line
      # to HEAD and fails any push made on a later day than the bump.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Secret scan over the FULL history, not just the diff: the repo's privacy stance is a
  # claim about everything ever committed. Config (rules + allowlists) is .gitleaks.toml.
  # fetch-depth: 0 is required: a shallow clone would silently scan almost nothing.
  secrets:
    runs-on: ubuntu-latest
    # On pull requests the action lists the PR's commits through the API with GITHUB_TOKEN.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
